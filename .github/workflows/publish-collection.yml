name: Restore reviewed collection
on:
  push:
    branches: [main]
    paths:
      - scripts/restore_media.py
      - .github/workflows/publish-collection.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mimibox-restore-${{ github.ref }}
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Restore pinned originals and generate thumbnails
        run: python scripts/restore_media.py
      - name: Validate files, retrieval and importer
        run: |
          npm test
          npm run build
      - name: Commit verified media
        run: |
          git add public/images public/thumbnails
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "feat: publish verified original media and thumbnails"
            git push origin HEAD:main
          fi
