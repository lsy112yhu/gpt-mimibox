name: Validate MimiBox
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scripts/restore_media.py --if-missing
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: mimibox-static
          path: dist
          retention-days: 7
