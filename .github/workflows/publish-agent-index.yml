name: Publish read-only agent index
on:
  push:
    branches: [main]
    paths:
      - data/catalog.json
      - scripts/export_agent_index.py
      - .github/workflows/publish-agent-index.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mimibox-agent-index
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/export_agent_index.py
      - name: Commit generated catalog shards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A public/agent
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh public MimiBox agent index'
            git push
          fi
